<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
  <title>Area Sposi | Risposte RSVP</title>
  <style>
    :root {
      --bg-color: #fdfaf6;
      --primary-color: #d4a373;
      --text-color: #333333;
      --text-light: #666666;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Montserrat', Arial, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 1400px;
      overflow-x: auto;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.05);
    }
    h1 {
      font-family: var(--font-serif);
      text-align: center;
      font-size: 2.5rem;
      color: var(--primary-color);
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 40px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--bg-color);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(212,163,115,0.2);
    }
    .stat-card h3 {
      font-size: 2.5rem;
      margin: 0 0 5px 0;
      font-family: var(--font-serif);
      color: var(--text-color);
    }
    .stat-card p {
      margin: 0;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-color);
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      background: var(--primary-color);
    }
    th:first-child { border-radius: 8px 0 0 0; }
    th:last-child { border-radius: 0 8px 0 0; }
    tr:hover {
      background-color: rgba(212,163,115,0.05);
    }
    .back-nav {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: var(--text-light);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.3s;
    }
    .back-nav:hover {
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-nav">← Torna all'invito</a>

  <div class="container">
    <h1>📋 Risposte RSVP</h1>
    <p class="subtitle">Risposte ricevute dal form "Ci sarai?"</p>

    <div class="stats-grid">
      <div class="stat-card">
        <h3 id="rsvp-totale">0</h3>
        <p>Totale Risposte</p>
      </div>
      <div class="stat-card">
        <h3 id="rsvp-si" style="color: #4caf50;">0</h3>
        <p>Confermati</p>
      </div>
      <div class="stat-card">
        <h3 id="rsvp-no" style="color: #f44336;">0</h3>
        <p>Non Partecipanti</p>
      </div>
      <div class="stat-card">
        <h3 id="rsvp-adulto" style="color: var(--primary-color);">0</h3>
        <p>🍽️ Menu Adulto</p>
      </div>
      <div class="stat-card">
        <h3 id="rsvp-baby" style="color: #ff9800;">0</h3>
        <p>🍟 Menu Baby</p>
      </div>
      <div class="stat-card">
        <h3 id="rsvp-seggiolone" style="color: #ff9800;">0</h3>
        <p>🪑 Seggiolone</p>
      </div>
    </div>

    <h2 style="margin: 30px 0 10px 0; font-family: var(--font-serif); color: #4caf50;">✅ Confermati</h2>
    <table id="rsvp-table-si">
      <thead>
        <tr><th>Nome</th><th>Cognome</th><th>Tipo</th><th>Menu</th><th>Note</th><th>Data</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2 style="margin: 40px 0 10px 0; font-family: var(--font-serif); color: #f44336;">❌ Non Partecipanti</h2>
    <table id="rsvp-table-no">
      <thead>
        <tr><th>Nome</th><th>Cognome</th><th>Tipo</th><th>Menu</th><th>Note</th><th>Data</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function parseCSVLine(line) {
      const parts = [];
      let current = '';
      let inQuotes = false;
      for (let c of line) {
        if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { parts.push(current.trim()); current = ''; }
        else { current += c; }
      }
      parts.push(current.trim());
      return parts;
    }

    async function loadRsvpResponses() {
      try {
        const response = await fetch('data/risposte.csv');
        if (!response.ok) return;
        const csvData = await response.text();
        const lines = csvData.split('\n');
        const siRows = [], noRows = [];
        let adultoCount = 0, babyCount = 0, seggioloneCount = 0;

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const parts = parseCSVLine(lines[i]);
          if (parts.length < 7) continue;
          const entry = {
            timestamp: parts[0], nome: parts[1], cognome: parts[2],
            tipo: parts[3], risposta: parts[4], note: parts[5], menu: parts[6] || 'Adulto'
          };
          if (entry.risposta === 'Sì') {
            siRows.push(entry);
            if (entry.menu === 'Baby') babyCount++;
            else if (entry.menu === 'Seggiolone') seggioloneCount++;
            else adultoCount++;
          } else {
            noRows.push(entry);
          }
        }

        document.getElementById('rsvp-totale').innerText = siRows.length + noRows.length;
        document.getElementById('rsvp-si').innerText = siRows.length;
        document.getElementById('rsvp-no').innerText = noRows.length;
        document.getElementById('rsvp-adulto').innerText = adultoCount;
        document.getElementById('rsvp-baby').innerText = babyCount;
        document.getElementById('rsvp-seggiolone').innerText = seggioloneCount;
        renderRsvpTable('rsvp-table-si', siRows);
        renderRsvpTable('rsvp-table-no', noRows);
      } catch (e) {
        console.warn('Failed to load risposte.csv:', e);
      }
    }

    function renderRsvpTable(tableId, rows) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      tbody.innerHTML = '';
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px; color:#999;">Nessuna risposta</td></tr>`;
        return;
      }
      rows.forEach(r => {
        const menuBadge = r.menu === 'Baby'
          ? '<span style="background:#ff9800;color:#fff;padding:2px 8px;border-radius:10px;font-size:0.75rem;">🍟 Baby</span>'
          : r.menu === 'Seggiolone'
          ? '<span style="background:#ff9800;color:#fff;padding:2px 8px;border-radius:10px;font-size:0.75rem;">🪑 Seggiolone</span>'
          : '<span style="color:#999;font-size:0.85rem;">Adulto</span>';
        const tipoBadge = r.tipo === 'Principale'
          ? '<span style="font-weight:600;">Principale</span>'
          : '<span style="color:#888;">Accompagnatore</span>';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:500;">${r.nome}</td>
          <td>${r.cognome}</td>
          <td>${tipoBadge}</td>
          <td>${menuBadge}</td>
          <td style="font-size:0.85rem;color:#666;max-width:250px;">${r.note || '—'}</td>
          <td style="font-size:0.8rem;color:#999;">${r.timestamp}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadRsvpResponses();
  </script>
</body>
</html>
